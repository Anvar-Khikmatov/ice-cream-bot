<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>Muzqaymoq bot</title>
</head>
<body>  
    
    <div class="container">

        <div class="cd-overlay"></div>
        <div class="contact-info">
            <button class="cd-back-btn">&lsaquo;</button>
            <div class="CD">
                <p>Fozil - <a href="https://t.me/faz_25">Telegram</a></p>
                <p>+998 97 736 53 13</p>
                <p>+998 99 806 53 13</p>
                <p>Manzil:  <a href ="https://maps.app.goo.gl/LDgtjVXF3c4f8W8f6" > Arzon bozor</a></p>
            </div>
        </div>    
        
        <div class="homepage">

            <img class="logo" src="img/logo/logo.webp" loading="lazy" alt="logo">
            <div class="searchbar">
                <input id="searchInput" type="search"  placeholder=" &#x1F50E;&#xFE0E;  Mahsulotlarni qidirish">
            </div>

        
             <!-- Overlay for no search results - ADD THIS -->
            <div id="overlay" class="overlay">
                <div class="no-results">
                <span style="font-size:40px;">⚪⚫</span>
                <p>Oops! No matching ice cream found.</p>
                </div>
            </div>



            <!-- Brand Selection Menu -->

            <div class="content brand-menu">  
                <div class="brands" data-brand="dairy">
                    <img class="brands-img" src="img/logo/dairy.jpg" loading="lazy" alt="dairy">
                    <div class="brands-name">Dairy Classic</div>
                </div>    
                <div class="brands" data-brand="icegold">  
                    <img class="brands-img" src="img/logo/ice&gold.jpg" loading="lazy" alt="icegold">
                    <div class="brands-name">Ice & GolD</div>
                </div>
                <div class="brands" data-brand="muzqaymoqlar">
                    <img class="brands-img" src="img/logo/muzqaymoqlar.jpg" loading="lazy" alt="others">
                    <div class="brands-name">Muzqaymoqlar</div>
                </div>
                <div class="brands" data-brand="naturel">
                    <img class="brands-img" src="img/logo/naturel.webp" loading="lazy" alt="naturel">
                    <div class="brands-name">Naturel</div>
                </div>
                <div class="brands" data-brand="sodiqSavdo">
                    <img class="brands-img" src="img/logo/ss.jpg" loading="lazy" alt="sodiqSavdo">
                    <div class="brands-name">Sodiq Savdo</div>
                </div>
                <div class="brands" data-brand="zarli">
                    <img class="brands-img" src="img/logo/zarli.jpg" loading="lazy" alt="zarli">
                    <div class="brands-name">Zarli</div>
                </div>
                <div class="brands" data-brand="korovka">
                    <img class="brands-img" src="img/logo/korovka.jpg" loading="lazy" alt="korovka">
                    <div class="brands-name">Коровка из Кореновки</div>
                </div>
                <div class="brands" data-brand="bahroma">
                    <img class="brands-img" src="img/logo/bahroma.jpg" loading="lazy" alt="bahroma">
                    <div class="brands-name">Bahroma</div>
                </div>
                <div class="brands" data-brand="svitlogore">
                    <img class="brands-img" src="img/logo/svitlogore.jpg" loading="lazy" alt="svitlogore">
                    <div class="brands-name">Свитлогорье</div>
                </div>
            </div>
        </div>
        
       
             <!-- Ice Cream Menu (hidden by default) -->

        <div class="iceCream-menu">
            <div class="title">
                <button class="back-btn">&lsaquo;</button>
                <div class="title-name"></div>
            </div>
            <div class="ic-content">
                <!-- dynamically ic-box goes here -->
            </div>
        </div>
            


        <!-- Ice Cream Info View (hidden by default) -->
        <div class="iceCream-info">
            <div class="gallery-container">
                <button class="gallery-back-btn" style="display: none;">&lsaquo;</button>
                <div class="gallery-track"></div> <!-- Images load here -->
                <div class="gallery-dots"></div>   <!-- Dots load here -->
            </div>
            <div class="product-details">
                <div class="product-price"></div>
                <div class="product-names"></div>
                <div class="product-gram"></div>
                <div class="product-box-count">Karobkada soni: <span class="box-number"></span></div>
            </div>
        </div>  
        
        

        <div class="contacts" tabindex="0">Kontaktlar</div>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
