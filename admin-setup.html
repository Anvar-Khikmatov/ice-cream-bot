<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Setup - Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
       html, body {
        height: 100%;
        margin: 0;
        padding: 0;
    }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            overflow-x: hidden;
        }
        .spinner {
            animation: rotate 2s linear infinite;
        }
        @keyframes rotate { 
            100% { transform: rotate(360deg); }
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="antialiased text-slate-900">
    <!-- Background Decor -->
    <div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-indigo-200/30 blur-[120px] rounded-full pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-200/30 blur-[120px] rounded-full pointer-events-none"></div>

    <div id="root"></div>

 

    <script>
        const root = document.getElementById('root');

        const state = {
            isLoading: false,
            username: '',
            password: ''
        };

        function render() {
            if (!root) return;

            root.innerHTML = `
                <div class="min-h-screen w-full flex items-center justify-center relative z-10">
                    <div class="w-full max-w-[500px] bg-white rounded-[2.5rem] shadow-xl shadow-slate-200/50 p-8 md:p-12 transition-all">
                        <div class="mb-10 text-center">
                            <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-50 rounded-2xl mb-6">
                                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-600">
                                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                                </svg>
                            </div>
                            <h1 class="text-3xl font-bold text-slate-900 tracking-tight mb-2">Admin Setup</h1>
                            <p class="text-slate-500 font-medium text-sm">Create your admin account to manage the bot</p>
                        </div>

                        <form id="admin-form" class="flex flex-col gap-6">
                            <div class="flex flex-col gap-1.5 w-full">
                                <label for="username" class="text-sm font-medium text-slate-600 ml-1">Username</label>
                                <input 
                                    id="username" 
                                    type="text" 
                                    value="${state.username}" 
                                    placeholder="Choose your username"
                                    class="px-4 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all duration-200 text-slate-800 placeholder:text-slate-400"
                                    required
                                >
                            </div>

                            <div class="flex flex-col gap-1.5 w-full">
                                <label for="password" class="text-sm font-medium text-slate-600 ml-1">Password</label>
                                <input 
                                    id="password" 
                                    type="password" 
                                    value="${state.password}" 
                                    placeholder="Choose a strong password"
                                    class="px-4 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all duration-200 text-slate-800 placeholder:text-slate-400"
                                    required
                                >
                            </div>

                            <div class="flex flex-col gap-4 mt-4">
                                <button
                                    id="submit-btn"
                                    type="submit"
                                    ${state.isLoading || !state.username || !state.password ? 'disabled' : ''}
                                    class="w-full py-4 rounded-xl font-semibold text-white shadow-lg transition-all duration-200 flex items-center justify-center gap-2 
                                    ${state.isLoading || !state.username || !state.password 
                                        ? 'bg-indigo-300 cursor-not-allowed' 
                                        : 'bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] shadow-indigo-200'}"
                                >
                                    ${state.isLoading ? `
                                        <svg class="spinner h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                        </svg>
                                        Creating Admin Account...
                                    ` : 'Create Admin Account'}
                                </button>
                            </div>
                        </form>

                        <div class="mt-10 pt-8 border-t border-slate-100 text-center">
                            <p class="text-[11px] text-slate-400 leading-relaxed px-4">
                                This account will have full administrative access to the Ice Cream Bot system.
                            </p>
                        </div>
                    </div>
                </div>
            `;

            attachEventListeners();
        }

        function attachEventListeners() {
            const form = document.getElementById('admin-form');
            const usernameInput = document.getElementById('username');
            const passInput = document.getElementById('password');

            if (usernameInput) {
                usernameInput.addEventListener('input', (e) => {
                    state.username = e.target.value;
                    updateButtonState();
                });
            }

            if (passInput) {
                passInput.addEventListener('input', (e) => {
                    state.password = e.target.value;
                    updateButtonState();
                });
            }

            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    if (state.isLoading) return;

                    state.isLoading = true;
                    render();

                    // Call your existing createAdmin function
                    createAdmin();
                });
            }
        }

        function updateButtonState() {
            const btn = document.getElementById('submit-btn');
            if (!btn) return;

            const isDisabled = !state.username || !state.password || state.isLoading;
            btn.disabled = isDisabled;
            
            if (isDisabled) {
                btn.classList.add('bg-indigo-300', 'cursor-not-allowed');
                btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700', 'active:scale-[0.98]', 'shadow-indigo-200');
            } else {
                btn.classList.remove('bg-indigo-300', 'cursor-not-allowed');
                btn.classList.add('bg-indigo-600', 'hover:bg-indigo-700', 'active:scale-[0.98]', 'shadow-indigo-200');
            }
        }

        // Original createAdmin function
        async function createAdmin() {
            const username = state.username;
            const password = state.password;
            
            try {
                // Hash the password (using bcrypt or simple SHA-256)
                const hashedPassword = await hashPassword(password);
                
                // Insert into Supabase
                const response = await fetch(`${SUPABASE_URL}/rest/v1/admin_users`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password_hash: hashedPassword
                    })
                });
                
                state.isLoading = false;
                render();

                if (response.ok) {
                    alert('Admin account created! Now you can login.');
                } else {
                    alert('Error creating admin account. Please try again.');
                }
            } catch (error) {
                state.isLoading = false;
                render();
                alert('Error: ' + error.message);
            }
        }

        // Initial render
        render();
    </script>

    <script src="admin-setup.js"></script>

</body>
</html>
