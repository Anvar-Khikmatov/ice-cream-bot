<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Brand - Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
         .admin-brand-container {
           margin: 0;
           padding: 0;
            
        }
        
        .admin-header {
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid rgba(13, 164, 240, 0.466);
            position: relative;
        }
        
        .admin-back-btn {
            position: absolute;
            left: 30px;
            background: none;
            border: none;
            font-size: 40px;
            color: #3498db;
            cursor: pointer;
        }
        
        .admin-title {
            font-size: 20px;
            color: #3498db;
            font-weight: 600;
        }
        
        .action-info {
            text-align: center;
            padding: 10px;
            color: #666;
            font-size: 14px;
            background: #f5f9ff;
            border-bottom: 1px solid #e1f0ff;
        }
        
        .brands-grid {
            display: flex;
            flex-wrap: wrap;    
            justify-content: center;
            align-items: center;
            column-gap: 1.5rem;
            row-gap: 1rem;
            overflow-y: auto;
            margin-top: 3rem;
            padding: 0.4rem 0.2rem;
        }
        
        .admin-brand-card {
            width: 90px;
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .admin-brand-card:hover {
            transform: scale(1.05);
        }
        
        .admin-brand-img {
            width: 100%;
            height: 70px;
            border-radius: 10px;
            border: 2px solid #ddd;
        }
        
        .admin-brand-name {
            margin-top: 8px;
            text-align: center;
            font-size: 13px;
            color: #333;
            font-weight: 500;
        }
        
        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            width: fit-content;
            justify-content: center;
            align-items: center;
            margin: 1.5rem auto 1rem auto;
        }
    </style>
</head>
<body>
    <div class="container admin-brand-container">
        <div class="admin-header">
            <button class="admin-back-btn" onclick="goBack()">‹</button>
            <div class="admin-title">Brendni tanlang</div>
        </div>
        
        <div class="action-info" id="actionInfo">
            <!-- Shows "Adding new product to..." or "Managing products in..." -->
        </div>
        
        <div class="brands-grid" id="brandsGrid">
            <!-- Brands will be loaded here -->
        </div>
        
        <button class="logout-btn" onclick="logout()">🚪 Chiqish</button>
    </div>

    <script src="admin-brand-select.js"></script>
    <script src="auth.js"></script>    

    
</body>
</html>
