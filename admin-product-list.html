<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahsulotlarni Boshqarish - Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .product-list-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .list-header {
            width: 100%;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid rgba(13, 164, 240, 0.466);
            position: relative;
            background: white;
        }
        
        .list-back-btn {
            position: absolute;
            left: 30px;
            background: none;
            border: none;
            font-size: 40px;
            color: #3498db;
            cursor: pointer;
        }
        
        .list-title {
            font-size: 20px;
            color: #3498db;
            font-weight: 600;
            text-align: center;
        }
        
        .brand-info {
            text-align: center;
            padding: 10px;
            background: #f5f9ff;
            color: #3498db;
            font-weight: 500;
            border-bottom: 1px solid #e1f0ff;
        }
        
        .search-bar {
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
        }
        
        .search-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .products-container {
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            column-gap: 5%;
            row-gap: 25px;
        }
        .products-container::-webkit-scrollbar{
            display: none;
        }
        
        .product-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 1px solid #eaeaea;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }


        
        .product-image {
            width: 80px;
            height: 80px;
            border-radius: 5px;
            object-fit: cover;
            border: 2px solid #f0f0f0;
        }
        
        .product-info {
            flex: 1;
            justify-content: center;
        }
        
        .product-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 16px;
            display: flex;
            justify-content: center;
        }
        
        .product-details {
            font-size: 14px;
            color: #666;
        }
        
        .product-price {
            color: #e67e22;
            font-weight: 600;
        }
        
        .product-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: auto 0;
        }
        
        .action-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            min-width: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 106px;
            width: fit-content;
        }
        
        .edit-btn {
            background: #3498db;
            color: white;
        }
        
        .delete-btn {
            background: #e74c3c;
            color: white;
        }
        
        .no-products {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            font-size: 16px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #3498db;
        }
        
        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 20px auto;
            display: block;
            width: fit-content;
        }
        
        .product-gram {
            color: #7f8c8d;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container product-list-container">
        <div class="list-header">
            <button class="list-back-btn" onclick="goBack()">‹</button>
            <div class="list-title">Mahsulotlarni Boshqarish</div>
        </div>
        
        <div class="brand-info" id="brandInfo">
            <!-- Brand name will appear here -->
        </div>
        
        <div class="search-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Mahsulotlarni qidirish...">
        </div>
        
        <div class="products-container" id="productsContainer">
            <div class="loading">Yuklanmoqda...</div>
        </div>
        
        <div id="clear-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:1000; align-items:center; justify-content:center;">
            <div style="background:white; border-radius:16px; padding:24px; margin:20px; text-align:center;">
                <p class="ic-name" style="font-size:16px; font-weight:600; margin-bottom:8px;"></p>
                <p style="font-size:14px; color:#666; margin-bottom:20px;">Bu amalni qaytarib bo'lmaydi. Ishonchingiz komilmi?</p>
                <div style="display:flex; gap:10px;">
                <button id="modal-cancel" style="flex:1; padding:12px; border:1px solid #ddd; border-radius:8px; background:white; font-size:14px;">Bekor qilish</button>
                <button id="modal-confirm" style="flex:1; padding:12px; border:none; border-radius:8px; background:#ef5350; color:white; font-size:14px; font-weight:600;">O'chirish</button>
                </div>
            </div>
        </div>

        <!-- <button class="logout-btn" onclick="logout()">🚪 Chiqish</button> -->
    </div>

    
    <script src="admin-product-list.js"></script>
</body>
</html>
